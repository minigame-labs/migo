plugins {
    id 'com.android.library'
}

android {
    namespace 'com.minigame.host'
    compileSdk 34

    // Output AAR file name
    project.archivesBaseName = "migo"

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    sourceSets {
        main {
            // keep module-local jniLibs and also include workspace jniLibs produced by your build script
            jniLibs.srcDirs = ['src/main/jniLibs', file("$projectDir/../../../jniLibs")]
            assets.srcDirs = ['src/main/assets']
        }
    }

    // avoid duplicate native lib conflicts when same .so exists in multiple source dirs
    packagingOptions {
        pickFirst '**/*.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
}
