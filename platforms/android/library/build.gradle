plugins {
    id 'com.android.library'
}

android {
    namespace 'com.migo.runtime'
    compileSdk 34

    // Output AAR file name
    project.archivesBaseName = "migo"

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        consumerProguardFiles "consumer-rules.pro"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            // keep module-local jniLibs and also include workspace jniLibs produced by your build script
            jniLibs.srcDirs = ['src/main/jniLibs', file("$projectDir/../../../jniLibs")]
            assets.srcDirs = ['src/main/assets']
            // include generated BuildInfo.java
            java.srcDirs += "$buildDir/generated/source/buildinfo"
        }
    }

    // avoid duplicate native lib conflicts when same .so exists in multiple source dirs
    packagingOptions {
        pickFirst '**/*.so'
    }
}

// ---------------------------------------------------------------------------
// Generate BuildInfo.java from gradle version
// ---------------------------------------------------------------------------
task generateBuildInfo {
    def outputDir = file("$buildDir/generated/source/buildinfo/com/migo/runtime")
    def versionName = android.defaultConfig.versionName ?: "0.0.0"
    def taskProjectDir = projectDir
    outputs.dir outputDir
    inputs.property("sdkVersion", versionName)
    // BuildInfo contains BUILD_TIME and COMMIT; always regenerate to avoid stale metadata.
    outputs.upToDateWhen { false }

    doLast {
        outputDir.mkdirs()
        def timestamp = new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'")
                .with { timeZone = TimeZone.getTimeZone("UTC"); it }
                .format(new Date())

        def commitHash = "unknown"
        try {
            def proc = "git rev-parse --short HEAD".execute(null, taskProjectDir)
            proc.waitFor()
            if (proc.exitValue() == 0) {
                commitHash = proc.text.trim()
            }
        } catch (Exception ignored) {}

        def ver = versionName
        def buildInfoFile = new File(outputDir, "BuildInfo.java")
        buildInfoFile.text = """\
package com.migo.runtime;

/**
 * Auto-generated by the Gradle build. Do not edit manually.
 */
public final class BuildInfo {
    /** SDK version string */
    public static final String VERSION = "${ver}";
    /** Build timestamp (UTC) */
    public static final String BUILD_TIME = "${timestamp}";
    /** Git commit hash */
    public static final String COMMIT = "${commitHash}";

    private BuildInfo() {}
}
"""
    }
}

// Ensure BuildInfo is generated before Java compilation
tasks.configureEach { task ->
    if (task.name.startsWith('compile') && task.name.endsWith('JavaWithJavac')) {
        task.dependsOn generateBuildInfo
    }
}
preBuild.dependsOn generateBuildInfo

dependencies {
    // Zero dependencies - no AndroidX required
    // All annotations are replaced with JavaDoc comments
}
