pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "migo"
include ':library'
// The example is a *consumer* of what platforms/android ships, so it lives with
// the other examples rather than inside the product tree.
include ':c-host-example'
project(':c-host-example').projectDir = file('../../examples/c-host/android')
