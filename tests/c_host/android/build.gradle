plugins { id 'com.android.application' }

android {
    namespace 'com.migo.chost'
    compileSdk 34
    ndkVersion '23.2.8568313'

    defaultConfig {
        applicationId 'com.migo.chost'
        minSdk 26          // project floor; do not raise
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            // Skia and V8 are C++; the engine links libc++ dynamically rather
            // than statically because a static libc++ duplicates std::* symbols
            // across their two archives (see engine/.cargo/config.toml).
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // The Rust staticlib is an input to the CMake link, not a packaged .so, so
    // it is staged outside jniLibs by scripts/build-android-c-host.sh.
    sourceSets {
        main { jniLibs.srcDirs = [] }
    }

    buildTypes {
        debug { debuggable true }
    }
}
