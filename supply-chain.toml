# Central, fail-closed policy consumed by check-supply-chain.py and SBOM output.
# Advisory exceptions are exact and time-bounded; an upgrade that removes the
# warning also makes the stale exception fail, forcing this file to shrink.
schema = 1

[licenses]
allowed = [
  "0BSD",
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "BSL-1.1",
  "CDLA-Permissive-2.0",
  "IJG",
  "ISC",
  "LGPL-2.1-or-later",
  "LLVM-exception",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[gradle]
distribution_url = "https://services.gradle.org/distributions/gradle-8.4-bin.zip"
distribution_sha256 = "3e1af3ae886920c3ac87f7a91f816c0c7c436f276a6eefdb3da152100fef72ae"
wrapper_jar_sha256 = "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172"

[[advisory_exceptions]]
id = "RUSTSEC-2025-0141"
package = "bincode"
version = "1.3.3"
kind = "unmaintained"
expires = "2027-02-28"
reason = "deno_core 0.385 pins bincode 1; replace it when the runtime upstream migrates."
tracking = "https://rustsec.org/advisories/RUSTSEC-2025-0141.html"

[[advisory_exceptions]]
id = "RUSTSEC-2024-0436"
package = "paste"
version = "1.0.15"
kind = "unmaintained"
expires = "2027-02-28"
reason = "V8 code generation and a test decoder still pull paste; review on upstream update."
tracking = "https://rustsec.org/advisories/RUSTSEC-2024-0436.html"

[[license_file_exceptions]]
package = "syn-match"
version = "0.3.0"
expression = "MIT"
sha256 = "95f88a0c83ae213c5131d788e637f79cf03bad8fd8ee7d7da2d4f5220e3fb1e6"
reason = "The crate ships the canonical MIT text in LICENSE but omits the SPDX manifest field."
tracking = "https://github.com/crowlKats/syn-match"
