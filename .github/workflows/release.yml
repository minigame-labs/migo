name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Job 1: Quality gate (same as PR CI, ensures tag is clean) ───────
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # No LFS download: freshness reads committed pointer oid/size identities.

      # Block the release if any committed profile/ABI snapshot identity is
      # stale. Regenerate all affected products (see snapshots/README.md) before
      # tagging.
      - name: Check snapshot freshness
        run: |
          bash scripts/check-snapshot-freshness.sh --product-profile full
          bash scripts/check-snapshot-freshness.sh --product-profile slim

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
          cache-on-failure: true

      - name: Check Rust formatting
        working-directory: engine
        run: cargo fmt --all -- --check

      # Scope to the host-buildable crates (graphics needs skia/EGL, audio needs
      # alsa — system deps absent on this runner) and cap lints to warn against
      # the pre-existing backlog. Mirrors pr-ci.yml so the tag gate matches PR CI.
      - name: Run clippy lints (host-buildable crates)
        working-directory: engine
        run: cargo clippy -p shared -p io -p js-runtime --all-targets -- --cap-lints warn

      - name: Run Rust tests (host-buildable crates)
        working-directory: engine
        run: cargo test -p shared -p io -p js-runtime --lib
        env:
          RUST_BACKTRACE: 1

      - name: Shell script syntax check
        run: bash -n scripts/*.sh scripts/ci/*.sh

      - name: Product profile and R8 contract gates
        run: |
          bash scripts/test-product-profiles.sh
          bash scripts/test-r8-profile-contract.sh

  # ── Job 2: Release AAR build ────────────────────────────────────────
  release-android:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout (with LFS for V8 archives + snapshots)
        uses: actions/checkout@v5
        with:
          lfs: true

      # checkout leaves LFS objects as ~130-byte pointers; force-smudge the V8
      # archives + profile/ABI snapshots this release links/embeds. build.rs also
      # rejects unresolved pointers, but a release must fail rather than silently
      # take the slower source-JS fallback.
      - name: Materialize LFS objects (V8 archives + snapshots)
        run: |
          git lfs pull --include="engine/third_party/rusty_v8/aarch64/librusty_v8.a,engine/third_party/rusty_v8/x86_64/librusty_v8.a,engine/crates/js-runtime/snapshots/SNAPSHOT-*.bin"
          for f in \
            engine/third_party/rusty_v8/aarch64/librusty_v8.a \
            engine/third_party/rusty_v8/x86_64/librusty_v8.a \
            engine/crates/js-runtime/snapshots/SNAPSHOT-full-aarch64.bin \
            engine/crates/js-runtime/snapshots/SNAPSHOT-full-x86_64.bin \
            engine/crates/js-runtime/snapshots/SNAPSHOT-slim-aarch64.bin \
            engine/crates/js-runtime/snapshots/SNAPSHOT-slim-x86_64.bin ; do
            sz=$(stat -c %s "$f")
            echo "$f: $sz bytes"
            [ "$sz" -gt 100000 ] || { echo "ERROR: $f is still an LFS pointer"; exit 1; }
          done

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      # NO Rust cache — Swatinem/rust-cache prunes librusty_v8.a out of the v8
      # crate's build-script OUT_DIR while keeping the fingerprint "fresh", so a
      # warm-cache run fails the link with "could not find native static library
      # rusty_v8" (same reason it was dropped from the pr-ci build job). A cold
      # release build is well within the 120-min timeout.

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK + cargo-ndk
        run: |
          sdkmanager "ndk;23.2.8568313"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/23.2.8568313/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          cargo install cargo-ndk --locked

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('platforms/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build Android AARs (release)
        run: |
          bash scripts/build-aar.sh --product-profile full release
          bash scripts/build-aar.sh --product-profile slim release

      - name: Analyze AAR size report
        run: |
          python3 scripts/size_report/analyze_so.py platforms/android/dist/migo-full-release.aar \
            > platforms/android/dist/size-report-full.txt || true
          python3 scripts/size_report/analyze_so.py platforms/android/dist/migo-slim-release.aar \
            > platforms/android/dist/size-report-slim.txt || true

      - name: Generate checksums
        run: |
          cd platforms/android/dist
          sha256sum * > SHA256SUMS.txt

      - name: Write version metadata
        run: |
          cat > platforms/android/dist/version.json <<VEOF
          {
            "tag": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}",
            "type": "release",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          VEOF

      - name: Optional power baseline compare
        run: |
          if [ -f ci/metrics/current_power_metrics.json ]; then
            bash scripts/ci/run_power.sh \
              --current ci/metrics/current_power_metrics.json \
              --baseline ci/baselines/android_power_default.json \
              --summary-out reports/power-compare-summary.json
          else
            echo "skip power baseline compare: ci/metrics/current_power_metrics.json not found"
          fi

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            platforms/android/dist/*
            reports/*.json
          generate_release_notes: true
