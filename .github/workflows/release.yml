name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Job 1: Quality gate (same as PR CI, ensures tag is clean) ───────
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
          cache-on-failure: true

      - name: Check Rust formatting
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Run clippy lints
        working-directory: engine
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: engine
        run: cargo test --workspace --lib --doc
        env:
          RUST_BACKTRACE: 1

      - name: Shell script syntax check
        run: bash -n scripts/*.sh scripts/ci/*.sh

  # ── Job 2: Release AAR build ────────────────────────────────────────
  release-android:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
          cache-on-failure: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK + cargo-ndk
        run: |
          sdkmanager "ndk;23.2.8568313"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/23.2.8568313/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          cargo install cargo-ndk --locked

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('platforms/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build Android AAR (release)
        run: bash scripts/build-aar.sh release

      - name: Analyze AAR size report
        run: |
          python3 scripts/size_report/analyze_so.py platforms/android/dist/migo-release.aar \
            > platforms/android/dist/size-report.txt || true

      - name: Generate checksums
        run: |
          cd platforms/android/dist
          sha256sum * > SHA256SUMS.txt

      - name: Write version metadata
        run: |
          cat > platforms/android/dist/version.json <<VEOF
          {
            "tag": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}",
            "type": "release",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          VEOF

      - name: Optional power baseline compare
        run: |
          if [ -f ci/metrics/current_power_metrics.json ]; then
            bash scripts/ci/run_power.sh \
              --current ci/metrics/current_power_metrics.json \
              --baseline ci/baselines/android_power_default.json \
              --summary-out reports/power-compare-summary.json
          else
            echo "skip power baseline compare: ci/metrics/current_power_metrics.json not found"
          fi

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            platforms/android/dist/*
            reports/*.json
          generate_release_notes: true
