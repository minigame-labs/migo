name: Build V8 Snapshot

# V8 startup snapshots are PLATFORM-bound (OS + CPU arch): a snapshot serializes
# a live V8 heap, so it must be produced by the *same* android-<arch> V8 that
# the target .so links — a host-linux V8 (or the wrong CPU arch) produces a
# snapshot that fails V8's magic-number check at load and hard-crashes.
#
# We therefore generate the snapshot the "Deno issue #27496" way: cross-compile
# `migo-snapshot-gen` to the target Android ABI (linking the committed,
# self-built android V8 archive via Git LFS), then RUN it on that ABI's Android
# emulator/device.
#
#   x86_64 -> GitHub-hosted `ubuntu-latest` HAS /dev/kvm, so we boot a
#             hardware-accelerated x86_64 Android emulator and run the generator
#             on it (job below).
#
#   arm64  -> GitHub-hosted `ubuntu-24.04-arm` runners do NOT expose /dev/kvm,
#             so an arm64 Android emulator cannot be hardware-accelerated and
#             this approach is not available on hosted runners. Generate the
#             arm64 snapshot on a real arm64 device and commit/upload
#             engine/crates/js-runtime/snapshots/SNAPSHOT-aarch64.bin. The exact
#             device steps are documented in crates/snapshot-gen/src/main.rs.
#             (A self-hosted arm64 runner with an attached device could automate
#             this later.)
#
# This workflow uploads the snapshot as an artifact. Embedding into the .so is
# done by js-runtime/build.rs at .so build time: it picks
# snapshots/SNAPSHOT-<target arch>.bin for android targets only.

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    # On push only the fast `freshness` gate runs (the x86_64 generator is
    # workflow_dispatch-only). Freshness depends solely on the embedded JS
    # (js_sources_sha256) and the deno_core version (Cargo.lock) — so trigger on
    # exactly those, not on js-runtime Rust/docs or the V8 archive / snapshot-gen
    # crate (those only affect the dispatch-only generator, and op-change
    # staleness isn't caught by the v1 fingerprint anyway — see snapshots/README).
    paths:
      - "engine/crates/js-runtime/**.js"
      - "engine/Cargo.lock"
      - ".github/workflows/build-snapshot.yml"

concurrency:
  group: build-snapshot-${{ github.ref }}
  cancel-in-progress: true

# The x86_64 job (workflow_dispatch only) pushes the regenerated snapshot to a
# branch, so it needs contents:write. It surfaces a PR link rather than calling
# gh pr create (which would need the repo-wide "Actions can create PRs" toggle).
permissions:
  contents: write

jobs:
  # Release gate: confirm the COMMITTED per-arch snapshots are not stale vs the
  # current extension JS / deno_core version — host-only, no device needed
  # (those inputs are platform-independent). Fails the run if a present snapshot
  # is stale, telling you to regenerate (see engine/crates/js-runtime/snapshots/README.md §4).
  freshness:
    name: snapshot freshness gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # No LFS needed: the gate reads only *.manifest.json (plain text) + the
        # source tree, not the snapshot blobs themselves.
      - name: Check snapshot freshness
        run: bash scripts/check-snapshot-freshness.sh

  # Runs ONLY on manual workflow_dispatch. The ~15 min cross-compile + emulator
  # generation is wasteful on every push: a js-runtime *Rust* change doesn't
  # touch the embedded JS, so the snapshot stays fresh. On push only the fast
  # `freshness` gate above runs; when it goes red (embedded JS or deno_core
  # changed), click "Run workflow" here and this job regenerates the x86_64
  # snapshot, writes its manifest, and opens a PR. (arm64 has no hosted KVM —
  # regenerate it on a device: bash scripts/gen-snapshot.sh arm64 --device <id>.)
  snapshot-x86_64:
    name: snapshot (x86_64 / emulator)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # LFS is required: engine/third_party/rusty_v8/**/librusty_v8.a (the
      # self-built android V8 archives) are stored via Git LFS, and snapshot-gen
      # must link the android-x86_64 one so the snapshot's external-reference
      # table matches the .so's V8 exactly.
      - name: Checkout (with LFS for the android V8 archive)
        uses: actions/checkout@v5
        with:
          lfs: true

      # actions/checkout sets GIT_LFS_SKIP_SMUDGE during the initial checkout and
      # doesn't always smudge large objects back into the working tree, leaving
      # third_party/rusty_v8/x86_64/librusty_v8.a as a ~130-byte pointer — which
      # makes the rusty_v8 build script emit "could not find native static
      # library rusty_v8". Force the smudge and guard against a pointer.
      - name: Materialize android V8 archive from LFS
        run: |
          git lfs pull --include="engine/third_party/rusty_v8/x86_64/librusty_v8.a"
          sz=$(stat -c %s engine/third_party/rusty_v8/x86_64/librusty_v8.a)
          echo "x86_64 V8 archive: $sz bytes"
          [ "$sz" -gt 1000000 ] || { echo "ERROR: librusty_v8.a is still an LFS pointer"; exit 1; }

      # Pinned to match engine/rust-toolchain.toml (frozen build chain).
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-linux-android

      # NOTE: intentionally NO Rust cache here. Swatinem/rust-cache prunes large
      # files out of each crate's build-script OUT_DIR to shrink the cache —
      # including the `librusty_v8.a` that the `v8` crate's build script copies
      # there — while keeping that build script's fingerprint "fresh". On a cache
      # hit cargo then skips re-running the build script (so the archive is never
      # re-copied) and the final link fails with "could not find native static
      # library rusty_v8". This generator job runs only when the snapshot inputs
      # change, so a reliable ~15 min cold build beats a fragile cached one.

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Pin the NDK to the same version the .so build uses (pr-ci.yml build job)
      # and export ANDROID_NDK_HOME via $GITHUB_ENV so it is set for the
      # cross-compile AND emulator steps. NOTE: do NOT set it from
      # `${{ env.ANDROID_NDK_LATEST_HOME }}` — runner OS env vars are not in the
      # Actions `env` expression context, so that resolves to "" and breaks
      # cargo-ndk's NDK detection.
      - name: Install Android NDK + cargo-ndk
        run: |
          sdkmanager "ndk;23.2.8568313"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      # ReactiveCircus/android-emulator-runner needs /dev/kvm group-accessible.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cross-compile the generator to android-x86_64 against the committed
      # android V8 archive. `--allow-multiple-definition` tolerates the handful
      # of libc++ symbols defined in both V8 and (later) Skia archives; `-landroid`
      # supplies AHardwareBuffer symbols. NOTE: unlike arm64, x86_64 does NOT need
      # libclang_rt.builtins (no __clear_cache reference in cpu-x64.cc).
      - name: Cross-compile snapshot-gen (x86_64-android)
        working-directory: engine
        run: |
          export RUSTY_V8_ARCHIVE="$PWD/third_party/rusty_v8/x86_64/librusty_v8.a"
          export RUSTY_V8_SRC_BINDING_PATH="$PWD/third_party/rusty_v8/x86_64/src_binding.rs"
          export RUSTFLAGS="-C link-arg=-Wl,--allow-multiple-definition -C link-arg=-landroid"
          cargo ndk -t x86_64 --platform 26 build -p migo-snapshot-gen
          # Stage libc++_shared.so next to the binary here (ANDROID_NDK_HOME is
          # reliably set in this run-step) so the emulator-runner script below
          # does not depend on it being propagated into the action's shell.
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" \
             target/x86_64-linux-android/debug/libc++_shared.so

      # Boot a hardware-accelerated x86_64 emulator and run the generator on it.
      # IMPORTANT: android-emulator-runner executes each line of `script` as a
      # SEPARATE `/usr/bin/sh -c <line>`. So: no cross-line shell variables (they
      # don't persist), no `set ...` lines (no effect on later lines, and
      # `set -o pipefail` is even illegal in dash). Each line is a self-contained
      # command with literal paths. The action stops on the first failing line.
      - name: Generate snapshot on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb push engine/target/x86_64-linux-android/debug/libc++_shared.so /data/local/tmp/libc++_shared.so
            adb push engine/target/x86_64-linux-android/debug/migo-snapshot-gen /data/local/tmp/migo-snapshot-gen
            adb shell chmod 755 /data/local/tmp/migo-snapshot-gen
            adb shell "cd /data/local/tmp && LD_LIBRARY_PATH=/data/local/tmp MIGO_SNAPSHOT_OUT=/data/local/tmp/SNAPSHOT.bin ./migo-snapshot-gen"
            mkdir -p engine/crates/js-runtime/snapshots
            adb pull /data/local/tmp/SNAPSHOT.bin engine/crates/js-runtime/snapshots/SNAPSHOT-x86_64.bin

      - name: Inspect snapshot
        run: |
          f=engine/crates/js-runtime/snapshots/SNAPSHOT-x86_64.bin
          ls -la "$f"
          echo "size:  $(stat -c %s "$f") bytes"
          echo "sha256:"; sha256sum "$f"

      - name: Write manifest
        run: bash scripts/write-snapshot-manifest.sh x86_64 engine/crates/js-runtime/snapshots/SNAPSHOT-x86_64.bin

      # Push the regenerated snapshot to a branch and surface a one-click
      # "create PR" link in the run summary. We deliberately do NOT call
      # `gh pr create`: that needs the repo-wide "Allow GitHub Actions to create
      # and approve pull requests" setting (off by default, and a broad security
      # toggle we'd rather not flip). Pushing the branch (incl. the LFS object)
      # works with the default GITHUB_TOKEN; opening the PR is one click.
      - name: Push regen branch + surface PR link
        run: |
          set -euo pipefail
          bin=engine/crates/js-runtime/snapshots/SNAPSHOT-x86_64.bin
          man="$bin.manifest.json"
          # Skip when the regenerated bytes match what's committed (only the
          # manifest timestamp would differ) — nothing to push.
          if git diff --quiet -- "$bin"; then
            echo "x86_64 snapshot bytes unchanged — nothing to push."
            echo "x86_64 snapshot bytes unchanged — no regen branch pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="bot/regen-x86_64-snapshot"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$bin" "$man"
          git commit -m "chore(snapshot): regenerate x86_64 snapshot"
          git push -f origin "$branch"
          url="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.ref_name }}...${branch}?expand=1"
          {
            echo "### x86_64 snapshot regenerated"
            echo ""
            echo "Pushed to \`$branch\`. Open the PR (one click): $url"
            echo ""
            echo "> arm64 must be regenerated separately on a device — \`scripts/gen-snapshot.sh arm64 --device <serial>\` — and committed into the same PR."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Open the PR: $url"

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v5
        with:
          name: snapshot-x86_64
          path: |
            engine/crates/js-runtime/snapshots/SNAPSHOT-x86_64.bin
            engine/crates/js-runtime/snapshots/SNAPSHOT-x86_64.bin.manifest.json
          if-no-files-found: error
