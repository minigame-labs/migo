name: PR CI

on:
  # Architecture Markdown is part of executable boundary contracts, and legal
  # metadata is part of the release identity. A docs-only PR therefore still
  # needs the quality gate; do not add a blanket Markdown paths-ignore rule.
  pull_request:
  push:
    branches:
      - master

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Quality gates (fast, no NDK needed) ──────────────────────
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
          cache-on-failure: true

      - name: Check Rust formatting
        working-directory: engine
        run: cargo fmt --all -- --check

      # Several contract gates run cargo with `--locked --offline`: `--locked`
      # proves they cannot rewrite the lockfile, `--offline` proves they cannot
      # reach for a dependency that is not already pinned. Both are worth
      # keeping, but `--offline` needs a populated registry, and the rust-cache
      # key includes Cargo.lock -- so the first PR that changes the lockfile
      # (a crate rename, a dependency bump) gets a cache miss and every one of
      # those gates fails with "config.json not found in registry", which reads
      # like a registry outage rather than a cold cache. Fetching once here
      # populates it without giving the gates network access.
      - name: Populate the cargo registry for the offline gates
        working-directory: engine
        run: cargo fetch --locked

      - name: C ABI and Surface candidate contract
        run: |
          bash scripts/test-c-abi-surface-candidate.sh
          CC=clang CXX=clang++ bash scripts/test-c-abi-surface-candidate.sh

      - name: SurfaceAttachment lifecycle contract
        # ripgrep is not preinstalled on the runners, and the contract needs it
        # for its multiline patterns.
        run: |
          command -v rg >/dev/null 2>&1 || sudo apt-get install -y ripgrep
          bash scripts/test-surface-attachment-contract.sh

      - name: Platform/V8 dependency boundary contract
        run: bash scripts/test-platform-v8-boundary-contract.sh

      - name: Core/V8 dependency boundary contract
        run: bash scripts/test-core-v8-boundary-contract.sh

      - name: Foundation/runtime dependency boundary contract
        run: bash scripts/test-foundation-runtime-boundary-contract.sh

      - name: Platform services capability contract
        run: bash scripts/test-platform-services-capability-contract.sh

      # Source-only, so it belongs here rather than in the device lane -- which
      # is the point: the failure it catches (content calling a capability on
      # the wx namespace, which does not carry it) presents on a device as a
      # black screen with every host callback reporting success.
      - name: Example content namespace contract
        run: bash scripts/test-example-content-namespace-contract.sh

      - name: Linux SDK packaging tooling
        # Unit tests only. The packaging gate itself
        # (scripts/test-linux-sdk-contract.sh) needs the Debian bullseye
        # sysroot, a linux-gnu V8 archive and lld, none of which a stock runner
        # has -- it runs on the release machine after scripts/build-linux-sdk.sh.
        # These tests cover the parsers that gate depends on, and they are where
        # the subtle failures were: a substring match that counted local-dynamic
        # relocations as local-exec, and an export audit that read nm instead of
        # objdump and so reported 190 exports for a library that exports 12.
        run: |
          python3 scripts/ci/tests/test_abi_floor_audit.py
          python3 scripts/ci/tests/test_gen_linux_package_metadata.py
          python3 scripts/ci/tests/test_gen_android_package_metadata.py
          python3 scripts/ci/tests/test_write_linux_build_metadata.py
          python3 scripts/ci/tests/test_write_linux_v8_component_manifest.py

      - name: Artifact manifest tooling and contract
        run: |
          cargo fmt --manifest-path tools/artifact-manifest/Cargo.toml -- --check
          cargo test --manifest-path tools/artifact-manifest/Cargo.toml --locked
          bash scripts/test-artifact-manifest-contract.sh

      # Host clippy/test are SCOPED to the crates that build on a plain Linux
      # host: shared, io, runtime-v8. The graphics (skia → needs EGL/GLES dev
      # headers) and audio (alsa-sys → needs libasound) crates only build with
      # their system deps, which this fast gate does not install — they are
      # compiled for the real target by the Android `build` job below
      # (build-aar.sh via the NDK). Running them here would fail on missing
      # system headers (this gate never passed on master for that reason).
      #
      # Lints are capped to `warn` (incl. deny-by-default correctness lints like
      # clippy::erasing_op / await_holding_lock): pinning to 1.95.0 (frozen V8
      # build chain) surfaced a large backlog of PRE-EXISTING lints across the
      # workspace that predate this branch. `--cap-lints warn` keeps clippy
      # running and reporting (compile errors still fail the build) without the
      # backlog blocking. Remove the cap after the dedicated lint-cleanup PR.
      - name: Run clippy lints (host-buildable crates)
        working-directory: engine
        run: cargo clippy -p migo-shared -p migo-io -p migo-runtime-v8 -p migo-capi-abi --all-targets -- --cap-lints warn

      # Blocking gate for the host-buildable crates (shared + io + runtime-v8).
      # All their lib tests must pass. Previously-masked failures have been
      # fixed at the root: shared/runtime-v8 had 5 real defects / stale
      # assertions; io had test-only global state (domain/scheduler hooks + an
      # image-run counter) that deadlocked or raced under parallel execution and
      # is now per-instance. The handful of io tests needing image fixtures
      # absent in CI stay #[ignore]d. graphics/audio still can't build here (skia
      # EGL / alsa system deps) — android build-aar.sh is their real gate, and
      # core/capi inherit that limitation through their graphics dependency.
      #
      # `migo-capi-abi` has no dependencies at all, which is why it was split out
      # of `capi` in the first place: the ABI validation rules are exactly the
      # part that must be provable without a device or a graphics stack. Its
      # tests run with `--all-targets`, not `--lib`, because the boundary rules
      # live in `tests/` (struct prefixes, versioned-copy truncation, output
      # policy) and `--lib` would silently skip all 50 of them.
      - name: Run Rust tests (host-buildable crates)
        working-directory: engine
        run: |
          cargo test -p migo-shared -p migo-io -p migo-runtime-v8 --lib
          cargo test -p migo-capi-abi --all-targets
        env:
          RUST_BACKTRACE: 1

      - name: Shell script syntax check
        run: bash -n scripts/*.sh scripts/ci/*.sh platforms/*/spike/*.sh

      - name: Product profile and R8 contract gates
        run: |
          bash scripts/test-product-profiles.sh
          bash scripts/test-r8-profile-contract.sh

      - name: Python script syntax check
        run: |
          python3 -m py_compile \
            scripts/ci/compare_baseline.py \
            scripts/ci/check_migo_test_suite.py \
            scripts/gen-android-package-metadata.py \
            scripts/gen-linux-package-metadata.py \
            scripts/generate-android-artifact-manifests.py \
            scripts/write-android-build-metadata.py \
            scripts/write-linux-build-metadata.py \
            scripts/write-linux-v8-component-manifest.py \
            scripts/write-v8-component-manifest.py \
            scripts/verify-android-aar-manifests.py

  # ── Job 2: Linux Qt Host Kit (isolated source contract; no V8/LFS) ──
  linux-qt-host-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout (without LFS)
        uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Qt/X11 Host Kit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ ripgrep xvfb xauth \
            qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins \
            libx11-dev libxkbcommon-x11-dev libxcb-cursor0

      - name: Linux Qt Host Kit contract
        run: bash scripts/test-linux-qt-host-kit.sh

  # ── Job 3: Android AAR build — the real "does the whole project compile,
  # link, and embed the profile/ABI snapshot" gate (cross-compiles graphics/audio
  # via the NDK, where skia/alsa deps are handled). ───────────────────
  build:
    needs: [quality-gate, linux-qt-host-kit]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # LFS is required: the android V8 archives (third_party/rusty_v8/**/*.a)
      # AND the per-arch V8 snapshots (crates/runtime-v8/snapshots/*.bin) are
      # stored via Git LFS. Without this they are ~130-byte pointer stubs and
      # the .so link (and snapshot embedding) would break.
      - name: Checkout (with LFS for V8 archives + snapshots)
        uses: actions/checkout@v5
        with:
          lfs: true

      # actions/checkout sets GIT_LFS_SKIP_SMUDGE during checkout and does not
      # reliably smudge large objects back into the tree, leaving the V8 archives
      # (and profile/ABI snapshots) as ~130-byte pointer stubs — which makes the
      # rusty_v8 build script emit "could not find native static library
      # rusty_v8" and the .so link fail. Force the smudge for exactly the files
      # this job links and the committed arm64 snapshots it embeds. x86_64
      # debug builds intentionally exercise the source-JS fallback until the
      # emulator workflow's full/slim snapshots are reviewed and committed;
      # the tag/release job remains fail-closed for those required artifacts.
      - name: Materialize LFS objects (V8 archives + snapshots)
        run: |
          git lfs pull --include="engine/third_party/rusty_v8/aarch64/librusty_v8.a,engine/third_party/rusty_v8/x86_64/librusty_v8.a,engine/crates/runtime-v8/snapshots/SNAPSHOT-*.bin"
          for f in \
            engine/third_party/rusty_v8/aarch64/librusty_v8.a \
            engine/third_party/rusty_v8/x86_64/librusty_v8.a \
            engine/crates/runtime-v8/snapshots/SNAPSHOT-full-aarch64.bin \
            engine/crates/runtime-v8/snapshots/SNAPSHOT-slim-aarch64.bin ; do
            sz=$(stat -c %s "$f")
            echo "$f: $sz bytes"
            [ "$sz" -gt 100000 ] || { echo "ERROR: $f is still an LFS pointer"; exit 1; }
          done

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      # NO Rust cache here — same rusty_v8 incompatibility as the snapshot job.
      # Swatinem/rust-cache prunes large files out of each crate's build-script
      # OUT_DIR to shrink the cache, including the `librusty_v8.a` the `v8` crate
      # copies there, while keeping that build script's fingerprint "fresh". On a
      # cache hit cargo then skips re-running the build script (so the archive is
      # never re-copied) and the link fails with "could not find native static
      # library rusty_v8" — reliably on the SECOND run (first cold run passes,
      # warm run breaks). Bumping the key only bought one green run. A cold
      # cross-compile of both ABIs is ~20 min, well inside the 90-min timeout, so
      # a reliable uncached build beats a cache that fails every other run.

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK + cargo-ndk
        run: |
          sdkmanager "ndk;23.2.8568313"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/23.2.8568313/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          cargo install cargo-ndk --locked

      # Layout-only compatibility check. This does not publish or claim an
      # armeabi-v7a artifact; it exercises the 8-byte uint64_t alignment used
      # by ARM ILP32 at the Android API 26 floor.
      - name: C ABI API 26 ARMv7 layout contract
        run: |
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang" \
          CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang++" \
            bash scripts/test-c-abi-surface-candidate.sh


      # The C ABI must compile for every platform it claims to support. This
      # lives in the Android job because it needs the NDK and the aarch64 V8
      # archive; the quality-gate job has neither.
      - name: C ABI platform contract
        run: bash scripts/test-capi-platform-contract.sh

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('platforms/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Release artifact manifest gate contract
        run: bash scripts/test-android-release-manifest-gate.sh

      # Host-JVM tests for the android.*-free state machines (VSync scheduling,
      # lifecycle requests, touch normalization). They used to be hand-rolled
      # `main()` runners invoked by two bespoke shell scripts that nothing in CI
      # called, so a state machine could regress unnoticed; one of them had no
      # runner at all. Both product flavors run because the flavor dimension
      # selects different Java sources.
      - name: Android library unit tests
        working-directory: platforms/android
        run: ./gradlew :library:testFullDebugUnitTest :library:testSlimDebugUnitTest

      # Build both products for both candidate ABIs. build.rs embeds only a
      # matching validated snapshot; the x86_64 debug slice currently verifies
      # the explicit source-JS fallback and is not a release-support claim.
      - name: Build Android AARs (debug)
        run: |
          bash scripts/build-aar.sh --product-profile full debug arm64-v8a x86_64
          bash scripts/build-aar.sh --product-profile slim debug arm64-v8a x86_64

      - name: Analyze AAR size report
        run: |
          python3 scripts/size_report/analyze_so.py platforms/android/dist/migo-full-debug.aar \
            > platforms/android/dist/size-report-full.txt || true
          python3 scripts/size_report/analyze_so.py platforms/android/dist/migo-slim-debug.aar \
            > platforms/android/dist/size-report-slim.txt || true

      - name: Optional perf baseline compare
        run: |
          if [ -f ci/metrics/current_metrics.json ]; then
            bash scripts/ci/run_perf.sh \
              --current ci/metrics/current_metrics.json \
              --baseline ci/baselines/android_perf_default.json \
              --summary-out reports/perf-compare-summary.json
          else
            echo "skip perf baseline compare: ci/metrics/current_metrics.json not found"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: migo-android-debug
          path: |
            platforms/android/dist/*
            reports/*.json
          if-no-files-found: warn
