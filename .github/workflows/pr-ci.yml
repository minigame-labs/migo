name: PR CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK + cargo-ndk
        run: |
          sdkmanager "ndk;23.2.8568313"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/23.2.8568313/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          cargo install cargo-ndk --locked

      # ── P1: Quality gates (fail fast before expensive AAR build) ──

      - name: Check Rust formatting
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Run clippy lints
        working-directory: engine
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: engine
        run: cargo test --workspace --lib --doc
        env:
          RUST_BACKTRACE: 1

      - name: Shell script syntax check
        run: bash -n scripts/*.sh scripts/ci/*.sh

      - name: Build Android AAR (debug)
        run: bash scripts/build-aar.sh debug

      - name: Analyze AAR size report
        run: |
          python3 scripts/size_report/analyze_so.py platforms/android/dist/migo-debug.aar > platforms/android/dist/size-report.txt || true

      - name: Optional perf baseline compare
        run: |
          if [ -f ci/metrics/current_metrics.json ]; then
            bash scripts/ci/run_perf.sh \
              --current ci/metrics/current_metrics.json \
              --baseline ci/baselines/android_perf_default.json \
              --summary-out reports/perf-compare-summary.json
          else
            echo "skip perf baseline compare: ci/metrics/current_metrics.json not found"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: migo-android-debug
          path: |
            platforms/android/dist/*
            reports/*.json
          if-no-files-found: warn

