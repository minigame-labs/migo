name: Apple SDK

# The expensive half of the Apple lane, on a cadence rather than on every PR.
#
# `apple-ci.yml` deliberately stops at the engine-free layer: the Rust crates
# that link no engine, and the Swift package that links no xcframework. Its own
# header says why the graphics path is excluded -- `migo-capi --features
# external-frames` pulls in skia-bindings, which compiles Skia from source, and
# that is an hour of C++ per cold cache. Paying it on every pull request would
# buy a very long red build and, most days, no new fact.
#
# What it would buy on a cadence is a fact nobody has: THE ENGINE HAS NEVER BEEN
# BUILT FOR AN APPLE TARGET. `scripts/build-apple-sdk.sh` has never run.
# `MigoEngine.xcframework` has never existed. The shipping Swift package has
# therefore never resolved, and the archive half of
# `test-apple-performance-rust-closure.sh` -- the one that reads a real symbol
# table rather than a dependency graph -- has never had an artifact to read.
#
# Every one of those is a thing the plan currently defers to "when a Mac
# arrives". A free unmetered macOS runner can answer all of them now, and the
# answer is worth having BEFORE the purchase decision rather than after.
#
# It runs weekly, on demand, and on `apple/**` branches. Not on pull requests:
# a job measured in hours must not be something a contributor waits on, and the
# properties a PR needs are already checked by the cheap lane.
#
# It is allowed to fail. That is not laxity -- nothing depends on it and no
# merge is gated by it -- it is the point: the first run's output is the fact,
# whichever way it goes, and a failure here names the specific thing that has to
# be solved before an Apple product exists.

on:
  workflow_dispatch:
  schedule:
    # Sunday 03:00 UTC. Weekly because what it catches -- an upstream Skia or
    # Xcode image change breaking the Apple build -- moves on that scale, and a
    # daily run of an hour-long job is a lot of somebody's shared quota.
    - cron: '0 3 * * 0'
  push:
    branches:
      - 'apple/**'

concurrency:
  group: apple-sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  performance-plus:
    # The Performance+ product -- no default features, no embedded engine -- for
    # each Apple slice group. Not `macos-v8`, which needs a V8 archive built for
    # Apple and no such archive exists in this repository yet; asking for it here
    # would fail for a reason that says nothing about the Apple toolchain.
    #
    # Three platforms rather than one, and the second of them is why. `ios` has a
    # single slice, so it takes the `cp` branch in build-apple-sdk.sh.
    # `ios-simulator` and `macos` have two each and take the `lipo` branch --
    # which, like everything else in that script, had never been executed. A
    # branch nobody has run is the same thing as a gate nobody has seen fail.
    #
    # `fail-fast: false` on purpose: this lane exists to produce facts, and the
    # first platform to break must not cancel the answer for the other two.
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # `destination` is what xcodebuild is told to build the Swift package
          # for, and it is per-platform for a reason that only became real when
          # a target started depending on the xcframework: SwiftPM's own `swift
          # build` builds for the host, so on these legs it would hand an
          # iOS-only artifact a request for a macOS slice.
          #
          # `host_slice` marks the one leg whose xcframework contains a slice
          # the runner itself can run. Only there can the package be linked into
          # a test bundle and executed.
          - platform: ios
            targets: aarch64-apple-ios
            destination: generic/platform=iOS
            host_slice: false
          - platform: ios-simulator
            targets: aarch64-apple-ios-sim,x86_64-apple-ios
            destination: generic/platform=iOS Simulator
            host_slice: false
          - platform: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            destination: platform=macOS
            host_slice: true

    env:
      # Inside the workspace so the archive the gate audits has a path the
      # workflow can name without knowing the script's default.
      MIGO_APPLE_BUILD_ROOT: ${{ github.workspace }}/build/apple

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: ${{ matrix.targets }}

      # Its own cache key, per platform, and not shared with apple-ci: each
      # platform's target directory holds a separately compiled Skia, and one key
      # for all of them would have each evicting the others' work.
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine -> target
          key: apple-sdk-${{ matrix.platform }}
          cache-on-failure: true

      - name: Record the toolchain that is answering
        run: |
          rustc --version --verbose
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          bash scripts/build-apple-sdk.sh --print-deployment-target ios
          bash scripts/build-apple-sdk.sh --print-deployment-target macos

      # The build. Debug rather than Release: the question this job answers first
      # is whether the graph compiles and links for the target at all, and a
      # Debug build reaches that answer sooner. Release belongs to the release
      # workflow, once there is a release to cut.
      - name: Build the Performance+ xcframework for ${{ matrix.platform }}
        run: >-
          bash scripts/build-apple-sdk.sh
          --platform ${{ matrix.platform }}
          --product performance-plus
          --configuration Debug
          --code-signing off

      # The archive half of the no-engine claim, which until now had no archive.
      # Its Cargo half runs on Linux every PR; this is the first time the same
      # gate has been able to read a symbol table produced by Apple's toolchain.
      # The staged archive, not one slice's. For the two multi-slice platforms
      # this is the lipo output, so what is audited is the bytes that go into the
      # xcframework rather than one of the inputs.
      - name: The built archive contains no engine symbols
        run: >-
          bash scripts/test-apple-performance-rust-closure.sh
          --artifact "$MIGO_APPLE_BUILD_ROOT/${{ matrix.platform }}-Debug/libmigo.a"

      # With the artifact present, the shipping Swift package resolves and is
      # compiled for the platform this leg built it for.
      #
      # `xcodebuild -destination` and not `swift build`: SwiftPM builds for the
      # host. That distinction was invisible while no target named the binary
      # target -- SwiftPM never had to find a slice, so `swift build` passed on
      # all three legs without ever reading the xcframework, and the lane whose
      # purpose is to check the artifact was green while checking nothing about
      # it. MigoAppleRenderer now depends on MigoEngine, which is the property
      # scripts/test-apple-shipping-package-contract.sh keeps.
      #
      # `-list` first, so a future scheme rename is a readable failure rather
      # than "does not contain a scheme named X" with no list of what it does
      # contain.
      #
      # MigoApplePerformancePlus is the scheme because its closure is the whole
      # lane: the renderer, the WebKit baseline and the engine-free core. The
      # one target outside it, MigoMacV8, is macOS-only and is covered by the
      # `swift build` below on the leg where that means something.
      - name: The shipping Swift package builds for ${{ matrix.platform }}
        working-directory: platforms/apple
        run: |
          ls -la Frameworks/
          xcodebuild -list
          xcodebuild build \
            -scheme MigoApplePerformancePlus \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      # What a non-Rust consumer has to link alongside the archive.
      #
      # A Rust binary gets these from cargo, which reads them out of every
      # dependency's build script. A Swift or Objective-C host linking
      # libmigo.a gets nothing: the directives are cargo metadata and are not in
      # the archive. So the list is asked of rustc rather than written down, and
      # printed here whether or not the link below succeeds -- when it fails,
      # the answer is already in the log next to the failure.
      #
      # Every leg, not just the one that links. The lists differ by platform and
      # the difference is the interesting part: macOS answers `-framework
      # OpenGL`, the legacy desktop GL framework, which has no iOS counterpart --
      # the measured form of why the Apple renderer needs ANGLE-Metal rather
      # than a system GL.
      #
      # `--target` and not a host build: cargo keeps `--target <host>` and no
      # `--target` in different directories, so omitting it would compile Skia
      # again for bytes the step above already built. The first target of the
      # leg, because the slices of one leg share a link line.
      #
      # `continue-on-error` because this step reports, it does not decide. The
      # question that matters is whether the tests link and run, and a failure
      # to produce a convenience listing must not be what stops the lane from
      # answering it.
      - name: Record what a C consumer must link alongside the archive
        continue-on-error: true
        working-directory: engine
        env:
          LEG_TARGETS: ${{ matrix.targets }}
        run: >-
          cargo rustc -p migo-capi --locked --target "${LEG_TARGETS%%,*}"
          --no-default-features --features external-frames
          -- --print native-static-libs

      # The only leg that can do this, and the first execution of this
      # repository's C ABI on Apple hardware.
      #
      # `swift build` covers every target including MigoMacV8; `swift test`
      # links a real binary -- the first time anything has linked libmigo.a
      # rather than compiled against its headers -- and runs assertions that
      # call migo_query_capabilities. Compilation cannot answer whether the
      # archive is complete; only a link can.
      - name: The shipping Swift package links and its tests run on Apple silicon
        if: matrix.host_slice
        working-directory: platforms/apple
        run: |
          swift build
          swift test

      # The same assertions, on the platform they are actually about.
      #
      # `swift test` above runs them on macOS, where `#if os(iOS)` is false. So
      # the iOS arm of `MigoEngineCapabilities.hostSurfaceKind` -- and every
      # assertion that reads it -- has been compiled for iOS and never executed
      # on it. This repository has been bitten by precisely that before, and
      # apple-ci.yml's header records it: the ILP32 assertions in the C ABI lane
      # were written, compiled once, and two of them were wrong about pointer
      # width the moment anything ran them. Writing a platform arm twice is not
      # testing it twice.
      #
      # It is also the first time the simulator slices are loaded rather than
      # merely linked: the `lipo` output this leg produces is what an app would
      # embed, and nothing had ever asked dyld to accept it.
      #
      # The simulator is chosen, not named. A hardcoded `name=iPhone 16` is one
      # runner-image bump away from failing for a reason that has nothing to do
      # with this repository, so the destination is the udid of whichever iPhone
      # runtime the image actually carries, newest first. If it carries none,
      # that is a fact about the image and the step says so.
      #
      # `Migo-Package` and not a product scheme: `xcodebuild -list` on this
      # package reports Migo-Package, MigoApplePerformancePlus, MigoAppleWebKit
      # and MigoMacV8, and only the first contains the test target. There is no
      # MigoAppleRenderer scheme -- it is a target, not a product.
      - name: The ABI tests run on iOS
        if: matrix.platform == 'ios-simulator'
        working-directory: platforms/apple
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys

          runtimes = json.load(sys.stdin)["devices"]

          # Sort key from com.apple.CoreSimulator.SimRuntime.iOS-18-5. Parsed
          # rather than compared as text: iOS-9-0 sorts after iOS-18-5
          # lexicographically, which would pick the oldest runtime on an image
          # carrying both.
          def version(identifier):
              digits = re.findall(r"\d+", identifier.rsplit(".", 1)[-1])
              return tuple(int(d) for d in digits)

          best = None
          for identifier, devices in runtimes.items():
              if ".SimRuntime.iOS-" not in identifier:
                  continue
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  if not device.get("name", "").startswith("iPhone"):
                      continue
                  key = (version(identifier), device["name"])
                  if best is None or key > best[0]:
                      best = (key, device["udid"], identifier, device["name"])

          if best is None:
              sys.exit("this runner image carries no available iPhone simulator")

          sys.stderr.write("selected " + best[3] + " on " + best[2] + "\n")
          print(best[1])
          ')"
          xcodebuild test \
            -scheme Migo-Package \
            -destination "platform=iOS Simulator,id=$udid" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      # The half of the deployment-floor contract that reads the product rather
      # than the declaration -- and the half its own header calls the one that
      # matters, citing the Android library whose floor was declared correctly
      # for API 26 while the shipped bytes carried a strong reference to an API
      # 29 symbol. Every declaration agreed; the artifact was wrong.
      #
      # It has never had an artifact to read, because no Apple artifact existed.
      # Now one does, so it reads LC_BUILD_VERSION out of every Mach-O in the
      # xcframework and checks minos against contracts/apple/deployment-floor.json.
      - name: The built Mach-O files carry the declared deployment target
        run: >-
          bash scripts/test-apple-deployment-floor-contract.sh
          --artifacts platforms/apple/Frameworks/MigoEngine.xcframework

      - name: Keep the xcframework
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MigoEngine-xcframework-${{ matrix.platform }}-debug
          path: platforms/apple/Frameworks/MigoEngine.xcframework
          if-no-files-found: warn
          retention-days: 14
