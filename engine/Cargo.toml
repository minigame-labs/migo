[workspace]
resolver = "2"
members = [
 "crates/audio",
 "crates/core",
 "crates/graphics",
 "crates/io",
 "crates/js-runtime",
 "crates/platform",
 "crates/shared"
]

[workspace.dependencies]
tokio = "1.46.1"
futures = "0.3.31"
serde = "1.0.219"
reqwest = { version = "=0.12.4", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
thiserror = "2.0.12"
http = "1.0"
data-url = "=0.3.1"
bytes = "1.4.0"
glow = { version = "0.16", default-features = false }
khronos-egl = { version = "6", features = ["dynamic"] }
femtovg = { version = "0.19.3", features = ["image-loading"] }
image = { version = "=0.25.8", default-features = true }
once_cell = "1.21.3"
crossbeam-channel = "0.5.15"

tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-android = "0.2.0"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["std"] }
smallvec = "1.15.1"
bytemuck = "1.23.2"
deno_core = {version = "0.343.0"}
deno_error = "=0.5.6"

raw-window-handle = "0.6.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true

panic = "abort"
