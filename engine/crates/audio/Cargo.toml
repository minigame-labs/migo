[package]
name = "migo-audio"
version.workspace = true
edition = "2024"

[lib]
name = "audio"

[dependencies]

# Decoders - lightweight combination
minimp3 = "0.6"      # MP3, MIT license
lewton = "0.10"      # OGG Vorbis, MIT/Apache-2.0
hound = "3.5"        # WAV, Apache-2.0

# Thread-safe audio buffer
ringbuf = "0.4"

# Async
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }

# HTTP client for streaming download
reqwest = { workspace = true }
futures-util = "0.3"

# Shared
shared = { package = "migo-shared", path = "../shared", default-features = false }
tracing = { workspace = true }

# Every platform except OpenHarmony reaches a device through cpal. OpenHarmony's
# userspace is musl with no ALSA, and cpal has no OHAudio backend, so pulling cpal there
# drags in alsa-sys and pkg-config for a library that does not exist on the device -- which
# is why the OpenHarmony package had to be built with profile-slim and shipped no audio at
# all. src/output_ohaudio.rs is the backend that replaces it.
[target.'cfg(not(all(target_os = "linux", target_env = "ohos")))'.dependencies]
cpal = "0.15"

# Android specific: use oboe backend + shared C++ STL.
# V8 is built with use_custom_libcxx=false (system shared STL).
# Both V8 and oboe share a single libc++_shared.so at runtime,
# following Android NDK best practice (one STL per process).
[target.'cfg(target_os = "android")'.dependencies.cpal]
version = "0.15"
features = ["oboe-shared-stdcxx"]

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"

[dev-dependencies]
# Occupies the shared streaming worker and requires a co-tenant task to run anyway.
migo-executor-probe = { path = "../../testing/executor-probe", default-features = false }
# Section 7.3's steady-state allocation gate. A dev-dependency by construction:
# the counting allocator must never be reachable from a shipped cdylib.
migo-alloc-probe = { path = "../../testing/alloc-probe", default-features = false }
