[package]
name = "migo-runtime-v8"
version = "0.1.0"
edition = "2024"

[lib]
name = "runtime_v8"
path = "src/lib.rs"

[features]
default = ["profile-full"]
profile-full = ["v8-limits", "code-signing", "api-sensors", "api-media", "api-connectivity", "api-commerce", "api-system"]
profile-slim = ["v8-limits", "code-signing"]
# Opt-in R9 A/B candidate. Android builds additionally require a validated,
# kind-bound Worker snapshot; the shipping default keeps source bootstrap.
worker-snapshot = []
v8-limits = ["shared/v8-limits"]
code-signing = ["shared/code-signing"]
# Gate the image crate behind a feature flag — runtime-v8 does not use it directly.
# Image decoding is handled by the `io` crate (which has its own `rust-image-decode` feature).
rust-image-decode = ["dep:image"]

# ---- API group feature gates (M25) ----
#
# Each feature controls whether the corresponding API domain's extension
# modules (Rust ops + JS ESM files + global scope registration) are compiled
# and included in the extension chain.  When a feature is disabled the
# entire extension is excluded: no ops are registered, no JS files are
# bundled, and the corresponding APIs do not appear on globalThis.
#
# Mapping to extensions:
#   api-sensors      -> host_v8_device  (sensors, battery, clipboard, vibration, screen, network, location, scan)
#   api-media        -> host_v8_media (camera, image_api, video) + host_v8_audio (WebAudio, InnerAudio, Recorder)
#   api-connectivity -> host_v8_system  (bluetooth, auth, window/system/device info, login, settings, navigate, game_log)
#   api-commerce     -> host_v8_share (share menu) + host_v8_payment (Midas payment)
#   api-system       -> host_v8_ui (Toast/Modal/Loading/ActionSheet) + host_v8_update + host_v8_ad + host_v8_worker
api-sensors = []
api-media = []
api-connectivity = []
api-commerce = []
api-system = []

[dependencies]
deno_core.workspace=true
# Only enable tokio features actually needed (not "full")
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "rt-multi-thread", "net"] }
tracing = { workspace = true }
shared = { package = "migo-shared", path = "../shared", default-features = false }
migo-io = { path = "../io", default-features = false, features = ["zip-extract"] }
serde.workspace = true
reqwest.workspace = true
base64 = "0.22"
percent-encoding = "2.3"
thiserror.workspace = true
http.workspace = true
data-url.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true
deno_error.workspace = true
glow.workspace = true
bytemuck.workspace = true
image = { workspace = true, optional = true }
parking_lot = "0.12.4"
tokio-tungstenite.workspace = true
# Ensure rustls 0.23 has a concrete crypto provider selected for WebSocket TLS.
# tokio-tungstenite enables rustls with default-features = false; without ring/
# aws-lc-rs, runtime handshake panics on provider auto-detection.
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
futures.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# Section 7.3's steady-state allocation gate. A dev-dependency by construction:
# the counting allocator must never be reachable from a shipped cdylib.
migo-alloc-probe = { path = "../../testing/alloc-probe" }
# Section 7.3's cross-session contention gate, same reasoning: dev-only by
# construction so no shipped build can reach it.
migo-contention-probe = { path = "../../testing/contention-probe" }
# Also a [build-dependencies] entry: the snapshot-fingerprint helper
# (build_snapshot.rs) is shared verbatim between build.rs and its regression test.
sha2 = "0.10"

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
