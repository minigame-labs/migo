[package]
name = "migo-shared"
version.workspace = true
license.workspace = true
edition = "2024"

[lib]
name = "shared"

[features]
default = ["v8-limits", "code-signing"]
codec-gbk = ["dep:encoding_rs"]
v8-limits = []
code-signing = ["dep:ed25519-dalek"]
# Hands the process-wide stats registry's lock to a cross-session contention gate in
# another crate. Enabled only through `[dev-dependencies]`, so resolver 2 keeps it out
# of every shipped build.
contention-probe = []

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
digest = "0.10"
md-5 = "0.10"
sha1 = "0.10"
tokio = { workspace = true, features = ["sync", "time"] }
bytemuck.workspace = true
encoding_rs = { version = "0.8.35", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
tracing = { workspace = true }
sha2 = { version = "0.10" }
ed25519-dalek = { version = "2", default-features = false, features = ["std"], optional = true }
crc32fast = "1"
zstd = { workspace = true }
bitflags = "2"
lru = { workspace = true }
smallvec = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
tokio = { workspace = true, features = ["net"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt"] }
# Test-only by construction: a `[dependencies]` entry here would carry a
# `#[global_allocator]` into every cdylib that links this crate.
migo-alloc-probe = { path = "../../testing/alloc-probe", default-features = false }
migo-contention-probe = { path = "../../testing/contention-probe", default-features = false }
