[package]
name = "capi"
version = "0.1.0"
edition = "2024"

# `staticlib` so a C host can link the engine into an executable today: the
# Linux V8 archive is built with executable-model TLS and cannot go into a
# shared object (CLAUDE.md §10). `cdylib` — and the shared-TLS V8 rebuild it
# needs — is deferred to the packaging slice. `rlib` keeps the boundary unit
# testable from Rust.
[lib]
name = "migo_capi"
path = "lib.rs"
crate-type = ["staticlib", "rlib"]

[features]
default = ["profile-full"]
profile-full = ["core/profile-full", "platform/profile-full"]
profile-slim = ["core/profile-slim", "platform/profile-slim"]

[dependencies]
core = { path = "../core", default-features = false }
platform = { path = "../platform", default-features = false }
shared = { path = "../shared", default-features = false }
graphics = { path = "../graphics", default-features = false }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The keyboard options arrive from the engine as JSON, which must not reach C:
# a host should not have to link a parser to open a keyboard, so the boundary
# translates it into `MigoKeyboardShowOptions`.
serde_json = { workspace = true }
