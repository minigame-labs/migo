[package]
name = "migo-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "migo_core"

[features]
default = ["profile-full"]
profile-full = ["runtime-v8/profile-full", "v8-limits", "code-signing", "api-sensors", "api-media", "api-connectivity", "api-commerce", "api-system", "graphics/profile-full"]
profile-slim = ["runtime-v8/profile-slim", "v8-limits", "code-signing", "graphics/profile-slim"]
worker-snapshot = ["runtime-v8/worker-snapshot"]
v8-limits = ["runtime-v8/v8-limits", "shared/v8-limits"]
code-signing = ["runtime-v8/code-signing", "shared/code-signing"]
api-sensors = ["runtime-v8/api-sensors"]
api-media = ["runtime-v8/api-media", "dep:audio"]
api-connectivity = ["runtime-v8/api-connectivity"]
api-commerce = ["runtime-v8/api-commerce"]
api-system = ["runtime-v8/api-system"]

[dependencies]
shared = { package = "migo-shared", path = "../shared", default-features = false }
runtime-v8 = { package = "migo-runtime-v8", path = "../runtime-v8", default-features = false }
graphics = { package = "migo-graphics", path = "../graphics", default-features = false }
migo-io = { path = "../io", default-features = false }
audio = { package = "migo-audio", path = "../audio", default-features = false, optional = true }
crossbeam-channel = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-android = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }

# On non-Android platforms, enable Rust-native implementations:
# - zip-extract: Unzip via Rust `zip` crate (Android uses java.util.zip via JNI)
# - codec-gbk: GBK encoding via `encoding_rs` crate (Android uses java.nio.charset via JNI)
# - rust-image-decode: image/zune-image decoders (Android uses BitmapFactory via JNI)
[target.'cfg(not(target_os = "android"))'.dependencies]
migo-io = { path = "../io", default-features = false, features = ["zip-extract", "rust-image-decode"] }
shared = { package = "migo-shared", path = "../shared", default-features = false, features = ["codec-gbk"] }
