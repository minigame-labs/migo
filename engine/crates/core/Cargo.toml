[package]
name = "core"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[features]
default = ["profile-full"]
profile-full = ["js-runtime/profile-full", "v8-limits", "code-signing", "api-sensors", "api-media", "api-connectivity", "api-commerce", "api-system", "graphics/profile-full"]
profile-slim = ["js-runtime/profile-slim", "v8-limits", "code-signing", "graphics/profile-slim"]
worker-snapshot = ["js-runtime/worker-snapshot"]
v8-limits = ["js-runtime/v8-limits", "shared/v8-limits"]
code-signing = ["js-runtime/code-signing", "shared/code-signing"]
api-sensors = ["js-runtime/api-sensors"]
api-media = ["js-runtime/api-media", "dep:audio"]
api-connectivity = ["js-runtime/api-connectivity"]
api-commerce = ["js-runtime/api-commerce"]
api-system = ["js-runtime/api-system"]

[dependencies]
shared = { path = "../shared", default-features = false }
js-runtime = { path = "../js-runtime", default-features = false }
graphics = { path = "../graphics", default-features = false }
io = { path = "../io", default-features = false }
audio = { path = "../audio", default-features = false, optional = true }
crossbeam-channel = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-android = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }

# On non-Android platforms, enable Rust-native implementations:
# - zip-extract: Unzip via Rust `zip` crate (Android uses java.util.zip via JNI)
# - codec-gbk: GBK encoding via `encoding_rs` crate (Android uses java.nio.charset via JNI)
# - rust-image-decode: image/zune-image decoders (Android uses BitmapFactory via JNI)
[target.'cfg(not(target_os = "android"))'.dependencies]
io = { path = "../io", default-features = false, features = ["zip-extract", "rust-image-decode"] }
shared = { path = "../shared", default-features = false, features = ["codec-gbk"] }
