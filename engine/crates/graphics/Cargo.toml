[package]
name = "graphics"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[features]
default = []

[dependencies]
glow = { workspace = true }
khronos-egl = { workspace = true }
tokio = { workspace = true }
skia-safe = { workspace = true }
crossbeam-channel = { workspace = true }
tracing = { workspace = true }
raw-window-handle = { workspace = true }
shared = { path = "../shared" }

libloading = { version = "^0.8" }
parking_lot = "0.12.4"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[dev-dependencies]
# PNG encode/decode for golden image pixel-diff tests.
# Avoid the workspace `image` crate (drops PNG in release profile).
png = "0.17"