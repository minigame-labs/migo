[package]
name = "js-runtime"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[features]
default = ["v8-limits", "code-signing"]
v8-limits = ["shared/v8-limits"]
code-signing = ["shared/code-signing"]
# Gate the image crate behind a feature flag — js-runtime does not use it directly.
# Image decoding is handled by the `io` crate (which has its own `rust-image-decode` feature).
rust-image-decode = ["dep:image"]

[dependencies]
deno_core.workspace=true
# Only enable tokio features actually needed (not "full")
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "rt-multi-thread", "net"] }
tracing = { workspace = true }
shared = {path = "../shared"}
io = { path = "../io", default-features = false }
serde.workspace = true
reqwest.workspace = true
thiserror.workspace = true
http.workspace = true
data-url.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true
deno_error.workspace = true
glow.workspace = true
bytemuck.workspace = true
image = { workspace = true, optional = true }
once_cell.workspace = true
parking_lot = "0.12.4"
tokio-tungstenite.workspace = true
futures.workspace = true