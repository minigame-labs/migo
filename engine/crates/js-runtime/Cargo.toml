[package]
name = "js-runtime"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[dependencies]
deno_core.workspace=true
# Only enable tokio features actually needed (not "full")
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "rt-multi-thread"] }
