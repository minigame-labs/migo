[package]
name = "platform"
version = "0.1.0"
edition = "2024"

[lib]
name = "platform"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["v8-limits", "code-signing"]
v8-limits = ["core/v8-limits"]
code-signing = ["core/code-signing"]

[dependencies]
core = {path = "../core"}
shared = {path = "../shared"}
js-runtime = {path = "../js-runtime"}
graphics = {path = "../graphics"}
io = { path = "../io", default-features = false }
crossbeam-channel = { workspace = true }
bytemuck = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
deno_error = { workspace = true }
deno_core = { workspace = true }
raw-window-handle = { workspace = true }

# On non-Android platforms, enable Rust-native implementations:
# - zip-extract: IOCmd::Unzip via Rust `zip` crate (Android uses java.util.zip via JNI)
# - codec-gbk: GBK encoding via `encoding_rs` crate (Android uses java.nio.charset via JNI)
[target.'cfg(not(target_os = "android"))'.dependencies]
io = { path = "../io", features = ["zip-extract", "rust-image-decode"] }
shared = { path = "../shared", features = ["codec-gbk"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
tracing-android = { workspace = true }
