[package]
name = "platform"
version = "0.1.0"
edition = "2024"

[lib]
name = "platform"
path = "lib.rs"
# rlib only. The Android cdylib (`libmigo.so`) is the separate `android-jni`
# crate: a cdylib here would be built for every target, and on a glibc host the
# Linux V8 archive cannot be linked into a shared object (CLAUDE.md §10), which
# is what previously kept `cargo test -p platform` and the Linux player from
# building without a crate-type toggle.
crate-type = ["rlib"]

[features]
default = ["profile-full"]
profile-full = ["v8-limits", "code-signing", "api-sensors", "api-media", "api-connectivity", "api-commerce", "api-system", "core/profile-full", "graphics/profile-full"]
profile-slim = ["v8-limits", "code-signing", "core/profile-slim", "graphics/profile-slim"]
worker-snapshot = ["core/worker-snapshot"]
v8-limits = ["core/v8-limits"]
code-signing = ["core/code-signing"]
api-sensors = ["core/api-sensors"]
api-media = ["core/api-media"]
api-connectivity = ["core/api-connectivity"]
api-commerce = ["core/api-commerce"]
api-system = ["core/api-system"]

[dependencies]
core = { path = "../core", default-features = false }
shared = { path = "../shared", default-features = false }
graphics = { path = "../graphics", default-features = false }
io = { path = "../io", default-features = false }
crossbeam-channel = { workspace = true }
bytemuck = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
khronos-egl = { workspace = true }
libloading = "^0.8"
parking_lot = { workspace = true }

# On non-Android platforms, enable Rust-native implementations:
# - zip-extract: Unzip via Rust `zip` crate (Android uses java.util.zip via JNI)
# - codec-gbk: GBK encoding via `encoding_rs` crate (Android uses java.nio.charset via JNI)
[target.'cfg(not(target_os = "android"))'.dependencies]
io = { path = "../io", default-features = false, features = ["zip-extract", "rust-image-decode"] }
shared = { path = "../shared", default-features = false, features = ["codec-gbk"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
tracing-android = { workspace = true }
