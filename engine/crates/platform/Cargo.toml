[package]
name = "platform"
version = "0.1.0"
edition = "2024"

[lib]
name = "platform"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["profile-full"]
profile-full = ["v8-limits", "code-signing", "api-sensors", "api-media", "api-connectivity", "api-commerce", "api-system", "core/profile-full", "js-runtime/profile-full", "graphics/profile-full"]
profile-slim = ["v8-limits", "code-signing", "core/profile-slim", "js-runtime/profile-slim", "graphics/profile-slim"]
worker-snapshot = ["core/worker-snapshot", "js-runtime/worker-snapshot"]
v8-limits = ["core/v8-limits"]
code-signing = ["core/code-signing"]
api-sensors = ["core/api-sensors", "js-runtime/api-sensors"]
api-media = ["core/api-media", "js-runtime/api-media"]
api-connectivity = ["core/api-connectivity", "js-runtime/api-connectivity"]
api-commerce = ["core/api-commerce", "js-runtime/api-commerce"]
api-system = ["core/api-system", "js-runtime/api-system"]

[dependencies]
core = { path = "../core", default-features = false }
shared = { path = "../shared", default-features = false }
js-runtime = { path = "../js-runtime", default-features = false }
graphics = { path = "../graphics", default-features = false }
io = { path = "../io", default-features = false }
crossbeam-channel = { workspace = true }
bytemuck = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
deno_error = { workspace = true }
deno_core = { workspace = true }
raw-window-handle = { workspace = true }

# On non-Android platforms, enable Rust-native implementations:
# - zip-extract: Unzip via Rust `zip` crate (Android uses java.util.zip via JNI)
# - codec-gbk: GBK encoding via `encoding_rs` crate (Android uses java.nio.charset via JNI)
[target.'cfg(not(target_os = "android"))'.dependencies]
io = { path = "../io", default-features = false, features = ["zip-extract", "rust-image-decode"] }
shared = { path = "../shared", default-features = false, features = ["codec-gbk"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
tracing-android = { workspace = true }
