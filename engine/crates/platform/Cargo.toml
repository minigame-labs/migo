[package]
name = "migo-platform"
version = "0.1.0"
edition = "2024"

[lib]
name = "platform"
# rlib only. This crate contains reusable platform policy and presenters, while
# each delivery boundary chooses its native artifact independently: Android's
# JNI `libmigo.so` lives in `android-jni`, and the Linux SDK links the C ABI
# static archive under an audited version script. Keeping artifact shape out of
# this crate also leaves host tests and the standalone player ordinary Rust
# consumers instead of forcing every target to emit the same library kind.
crate-type = ["rlib"]

[features]
default = ["profile-full"]
profile-full = ["v8-limits", "code-signing", "api-sensors", "api-media", "api-connectivity", "api-commerce", "api-system", "migo-core/profile-full", "graphics/profile-full"]
profile-slim = ["v8-limits", "code-signing", "migo-core/profile-slim", "graphics/profile-slim"]
worker-snapshot = ["migo-core/worker-snapshot"]
v8-limits = ["migo-core/v8-limits"]
code-signing = ["migo-core/code-signing"]
api-sensors = ["migo-core/api-sensors"]
api-media = ["migo-core/api-media"]
api-connectivity = ["migo-core/api-connectivity"]
api-commerce = ["migo-core/api-commerce"]
api-system = ["migo-core/api-system"]

[dependencies]
migo-core = { path = "../core", default-features = false }
shared = { package = "migo-shared", path = "../shared", default-features = false }
graphics = { package = "migo-graphics", path = "../graphics", default-features = false }
migo-io = { path = "../io", default-features = false }
crossbeam-channel = { workspace = true }
bytemuck = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
khronos-egl = { workspace = true }
libloading = "^0.8"
parking_lot = { workspace = true }

# On non-Android platforms, enable Rust-native implementations:
# - zip-extract: Unzip via Rust `zip` crate (Android uses java.util.zip via JNI)
# - codec-gbk: GBK encoding via `encoding_rs` crate (Android uses java.nio.charset via JNI)
[target.'cfg(not(target_os = "android"))'.dependencies]
migo-io = { path = "../io", default-features = false, features = ["zip-extract", "rust-image-decode"] }
shared = { package = "migo-shared", path = "../shared", default-features = false, features = ["codec-gbk"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
tracing-android = { workspace = true }
