[package]
name = "io"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[features]
default = ["zip-extract"]
zip-extract = ["dep:zip"]

[dependencies]
tokio = { workspace = true }
image = { workspace = true }
tracing = { workspace = true }
shared = { path = "../shared" }
deno_core.workspace = true
parking_lot = "0.12.4"

# Fast image decoder (unified, SIMD-optimized)
zune-image = { workspace = true }
zune-core = { workspace = true }

# LRU cache for decoded images
lru = { workspace = true }

# Lazy static for global cache
once_cell = { workspace = true }

# Zip extraction — optional, disable default features to exclude bzip2/zstd/aes/lzma/xz/zopfli
# Only enable deflate (most common) to save ~200-400KB of compression codecs
zip = { version = "2.2", optional = true, default-features = false, features = ["deflate"] }