[package]
name = "io"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[features]
default = ["zip-extract", "rust-image-decode"]
zip-extract = ["dep:zip"]
rust-image-decode = ["dep:image", "dep:zune-image", "dep:zune-core"]

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
shared = { path = "../shared" }
deno_core.workspace = true
parking_lot = "0.12.4"

# Image decoders — optional, excluded on Android (uses BitmapFactory via JNI)
image = { workspace = true, optional = true }
zune-image = { workspace = true, optional = true }
zune-core = { workspace = true, optional = true }

# LRU cache for decoded images
lru = { workspace = true }

# Lazy static for global cache
once_cell = { workspace = true }

# Base64 encoding for readZipEntry binary data
base64 = "0.22"

# Brotli decompression for readCompressedFile API
brotli = "7"

# Zip extraction — optional, disable default features to exclude bzip2/zstd/aes/lzma/xz/zopfli
# Only enable deflate (most common) to save ~200-400KB of compression codecs
zip = { version = "2.2", optional = true, default-features = false, features = ["deflate"] }
