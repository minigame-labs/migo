# =============================================================================
# Migo Engine - Android Build Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Host (x86_64-unknown-linux-gnu) — used by `cargo test` and dev builds
# -----------------------------------------------------------------------------
# Adds ~/.local/lib to the linker search path so rust-lld can find
# libfontconfig / libfreetype / libEGL via symlinks created by
# scripts/dev-setup-skia.sh.  On CI hosts with the corresponding -dev
# packages installed, this directory is simply empty and harmless.
# -----------------------------------------------------------------------------
# ARM64 (aarch64) - Most modern Android devices
# -----------------------------------------------------------------------------
[target.aarch64-linux-android]
ar = "aarch64-linux-android-ar"
linker = "aarch64-linux-android26-clang"
rustflags = [
  # Basic strip (equivalent to -s)
  "-C", "link-arg=-s",
  
  # Garbage collection of unused sections
  "-C", "link-arg=-Wl,--gc-sections",
  
  # Dynamically link libc++ (libc++_shared.so is shipped in jniLibs).
  # Skia-bindings and rusty_v8 both embed parts of the C++ runtime;
  # `-static-libstdc++` triggers duplicate-symbol errors for several
  # std::* classes (`runtime_error`, `exception`, `locale::id`, ...).
  # The dynamic path matches scripts/build-android-so.sh copying
  # libc++_shared.so into jniLibs/.
  #
  # Tolerate the handful of std::* symbols that are defined in both
  # V8's and Skia's archives; the linker picks the first definition,
  # which is safe because all archives use the same NDK libc++ ABI.
  "-C", "link-arg=-Wl,--allow-multiple-definition",
  
  # Use LLD linker for better optimization (if available)
  "-C", "link-arg=-fuse-ld=lld",
  
  # ICF (Identical Code Folding) - merges identical functions
  "-C", "link-arg=-Wl,--icf=all",
  
  # Use GNU hash style (smaller than sysv)
  "-C", "link-arg=-Wl,--hash-style=gnu",
  
  # Strip all symbols including debug
  "-C", "link-arg=-Wl,--strip-all",
  
  # NOTE: do not add `embed-bitcode=no` here. [profile.release] uses lto="fat",
  # and rustc rejects `-C embed-bitcode=no` together with `-C lto` as a hard
  # error (breaks the release AAR link). cargo embeds bitcode as LTO requires,
  # and --strip-all drops it from the shipped .so, so there is no size cost.

  # Exclude frame pointers (smaller but harder to debug crashes)
  "-C", "force-frame-pointers=no",

  # Disable unwind tables (not needed with panic=abort)
  "-C", "force-unwind-tables=no",

  # Only link truly needed shared libraries
  "-C", "link-arg=-Wl,--as-needed",

  # Read-only relocations (security hardening)
  "-C", "link-arg=-Wl,-z,relro",
  "-C", "link-arg=-Wl,-z,now",

  # Version script: only export JNI symbols, hide everything else
  "-C", "link-arg=-Wl,--version-script=version.script",
]

# -----------------------------------------------------------------------------
# x86_64 - Emulators and Chromebooks
# -----------------------------------------------------------------------------
[target.x86_64-linux-android]
ar = "x86_64-linux-android-ar"
linker = "x86_64-linux-android26-clang"
rustflags = [
  "-C", "link-arg=-s",
  "-C", "link-arg=-Wl,--gc-sections",
  "-C", "link-arg=-Wl,--allow-multiple-definition",
  "-C", "link-arg=-fuse-ld=lld",
  "-C", "link-arg=-Wl,--icf=all",
  "-C", "link-arg=-Wl,--hash-style=gnu",
  "-C", "link-arg=-Wl,--strip-all",
  "-C", "force-frame-pointers=no",
  "-C", "force-unwind-tables=no",

  # Only link truly needed shared libraries
  "-C", "link-arg=-Wl,--as-needed",

  # Read-only relocations (security hardening)
  "-C", "link-arg=-Wl,-z,relro",
  "-C", "link-arg=-Wl,-z,now",

  # Version script: only export JNI symbols, hide everything else
  "-C", "link-arg=-Wl,--version-script=version.script",
]

# -----------------------------------------------------------------------------
# ARMv7 (32-bit) - Legacy devices
# -----------------------------------------------------------------------------
[target.armv7-linux-androideabi]
ar = "arm-linux-androideabi-ar"
linker = "armv7a-linux-androideabi26-clang"
rustflags = [
  "-C", "link-arg=-s",
  "-C", "link-arg=-Wl,--gc-sections",
  "-C", "link-arg=-Wl,--allow-multiple-definition",
  "-C", "link-arg=-fuse-ld=lld",
  "-C", "link-arg=-Wl,--icf=all",
  "-C", "link-arg=-Wl,--hash-style=gnu",
  "-C", "link-arg=-Wl,--strip-all",
  "-C", "force-frame-pointers=no",
  "-C", "force-unwind-tables=no",

  # Only link truly needed shared libraries
  "-C", "link-arg=-Wl,--as-needed",

  # Read-only relocations (security hardening)
  "-C", "link-arg=-Wl,-z,relro",
  "-C", "link-arg=-Wl,-z,now",

  # Version script: only export JNI symbols, hide everything else
  "-C", "link-arg=-Wl,--version-script=version.script",
]

# -----------------------------------------------------------------------------
# Build Configuration
# -----------------------------------------------------------------------------
[build]
# Use all available CPU cores for compilation
# jobs = 8  # Uncomment and adjust if needed

# -----------------------------------------------------------------------------
# Nightly Features (Optional - requires nightly toolchain)
# -----------------------------------------------------------------------------
# Uncomment these lines if using nightly for additional size reduction:
# 
# [unstable]
# build-std = ["std", "panic_abort"]
# build-std-features = ["panic_immediate_abort"]

# -----------------------------------------------------------------------------
# Environment Variables for Build Scripts
# -----------------------------------------------------------------------------
[env]
# These can be overridden by actual environment variables
# CARGO_PROFILE_RELEASE_LTO = "fat"
# CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "1"
# CARGO_PROFILE_RELEASE_OPT_LEVEL = "z"

# ---- Skia GN build arguments ----------------------------------------------
# Disable fontconfig on Linux (we ship SkFontMgr_Android on device and a
# TypefaceFontProvider with bundled fonts for headless tests). This avoids
# the system libfontconfig-dev dependency.
#
# extra_cflags_cc adds C++-only flags WITHOUT overriding skia-bindings'
# own extra_cflags (-Oz / -D__ANDROID_API__). We drop unwind tables:
# the engine builds with panic=abort and Skia is compiled -fno-exceptions,
# so the .eh_frame / .eh_frame_hdr unwind data (~part of 3 MB) is dead
# weight in the final .so. -fno-asynchronous-unwind-tables removes the
# per-function CFI; -fno-unwind-tables drops the rest.
SKIA_GN_ARGS = "skia_use_fontconfig=false skia_enable_fontmgr_fontconfig=false extra_cflags_cc=[\"-fno-asynchronous-unwind-tables\",\"-fno-unwind-tables\"]"

# On WSL / Ubuntu hosts, Skia's C++20 consteval usage in src/base/SkTime.cpp
# does not compile with clang-12 against the GCC-13 libstdc++ shipped by
# Ubuntu 24.04 (see Skia bug 353527181).  Force a newer clang explicitly;
# the Android NDK still uses its own bundled clang for cross-compile.
# These defaults are overridden by environment variables if set.
CC = "clang-18"
CXX = "clang++-18"

# The two entries above have no per-target form -- cargo's `[env]` applies to
# every target -- so on Windows they name a compiler that does not exist and
# every cc-rs build script in the graph dies with `ToolNotFound: clang-18`.
#
# cc-rs resolves `CC_<target>` before plain `CC`, so naming the target here is
# provably inert for Android and Linux: those targets never read these keys.
# It is equally inert for the host-test path, which exports a plain `CC` to
# beat this non-forcing block (scripts/dev-test-host.sh) -- that precedence is
# unchanged because a plain `CC` is what it overrides.
#
# clang-cl rather than MSVC's cl: skia-bindings on Windows probes fixed paths
# for clang-cl.exe and refuses to build without it, so LLVM is already a hard
# prerequisite there. Naming the same compiler keeps one toolchain in play
# instead of two. Resolved through PATH, not an absolute path, so a non-default
# LLVM location still works.
#
# ⚠ PATH order matters, and getting it wrong fails deep instead of early. An
# Android NDK on PATH ships its own clang-cl.exe -- r23c's is clang 12 -- and
# it will be found first if it comes before the LLVM install. The failure
# surfaces a thousand build steps later inside MSVC's own headers
# (`STL1000: Unexpected compiler version, expected Clang 19.0.0 or newer`),
# which reads like a broken STL rather than a shadowed compiler. Put the LLVM
# directory ahead of the NDK's, or set CC_x86_64_pc_windows_msvc to an
# absolute path for that machine.
CC_x86_64_pc_windows_msvc = "clang-cl"
CXX_x86_64_pc_windows_msvc = "clang-cl"

# Khronos EGL/GL/GLES headers for Skia's GL EGL interface are expected in the
# environment via CPATH.  On WSL / minimal Ubuntu hosts without root access,
# run `scripts/dev-setup-skia.sh` once to fetch them to ~/.local/skia-headers
# and to export CPATH.  On machines with `libegl1-mesa-dev` installed, no
# extra setup is required.
